[package]
name = "security-watch"
version = "0.1.0"
edition = "2024"
description = "Double-click security check for a Windows PC and its Linux SSH servers"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
